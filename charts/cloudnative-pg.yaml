# CloudNativePG Operator
# https://cloudnative-pg.io/

enabled: true

chart:
  repository: https://cloudnative-pg.github.io/charts
  name: cloudnative-pg
  version: ""

release:
  name: cnpg
  namespace: cnpg-system

ingress:
  enabled: false

values:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

---
# PostgreSQL Cluster (uses CloudNativePG operator)

enabled: true

chart:
  repository: https://cloudnative-pg.github.io/charts
  name: cluster
  version: ""

release:
  name: postgresql
  namespace: postgresql

ingress:
  enabled: false

values:
  type: postgresql
  mode: standalone

  cluster:
    instances: 1

    monitoring:
      enablePodMonitor: true

    storage:
      size: 5Gi
      storageClass: standard

    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

    postgresql:
      parameters:
        max_connections: "100"
        shared_buffers: "128MB"
        log_statement: "all"

    bootstrap:
      initdb:
        database: devdb
        owner: developer
        secret:
          name: postgresql-credentials

    # Declarative role management (under cluster section)
    # See: https://cloudnative-pg.io/documentation/current/declarative_role_management/
    roles:
      - name: dex
        ensure: present
        login: true
        passwordSecret:
          name: dex-db-credentials
      - name: argocd
        ensure: present
        login: true
        passwordSecret:
          name: argocd-db-credentials

  # Declarative database management (top-level)
  databases:
    - name: dex
      ensure: present
      owner: dex
    - name: argocd
      ensure: present
      owner: argocd

postInstall: |
  ---
  # Database credentials for managed roles
  apiVersion: v1
  kind: Secret
  metadata:
    name: dex-db-credentials
    namespace: postgresql
  type: kubernetes.io/basic-auth
  stringData:
    username: dex
    password: "LocalDex321"
  ---
  apiVersion: v1
  kind: Secret
  metadata:
    name: argocd-db-credentials
    namespace: postgresql
  type: kubernetes.io/basic-auth
  stringData:
    username: argocd
    password: "LocalArgo321"
  ---
  apiVersion: v1
  kind: Secret
  metadata:
    name: postgresql-credentials
    namespace: postgresql
  type: kubernetes.io/basic-auth
  stringData:
    username: developer
    password: "LocalDev123!"
  ---
  # TCP routing for PostgreSQL, Redis, OpenSearch (nginx reads from 'tcp-services' ConfigMap)
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: tcp-services
    namespace: ingress-nginx
  data:
    "5432": "postgresql/postgresql-cluster-rw:5432"
    "5433": "postgresql/postgresql-cluster-ro:5432"
    "6379": "redis/redis:6379"
    "9200": "opensearch/opensearch-cluster-master:9200"
  ---
  # Expose PostgreSQL TCP ports via nginx ingress
  apiVersion: v1
  kind: Service
  metadata:
    name: nginx-postgresql
    namespace: ingress-nginx
  spec:
    type: LoadBalancer
    ports:
    - name: postgresql-rw
      port: 5432
      targetPort: 5432
      protocol: TCP
    - name: postgresql-ro
      port: 5433
      targetPort: 5433
      protocol: TCP
    selector:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/component: controller
  ---
  # VMPodScrape for CloudNativePG metrics (VictoriaMetrics)
  apiVersion: operator.victoriametrics.com/v1beta1
  kind: VMPodScrape
  metadata:
    name: cloudnative-pg
    namespace: postgresql
    labels:
      release: vm
  spec:
    podMetricsEndpoints:
    - port: metrics
      path: /metrics
      scheme: http
    selector:
      matchLabels:
        cnpg.io/cluster: postgresql-cluster
  ---
  # Postgres Exporter - exposes detailed pg_* metrics
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: postgres-exporter
    namespace: postgresql
    labels:
      app: postgres-exporter
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: postgres-exporter
    template:
      metadata:
        labels:
          app: postgres-exporter
      spec:
        containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:latest
          ports:
          - containerPort: 9187
            name: metrics
          env:
          - name: DATA_SOURCE_URI
            value: "postgresql-cluster-rw.postgresql.svc:5432/postgres?sslmode=require"
          - name: DATA_SOURCE_USER
            value: "postgres"
          - name: DATA_SOURCE_PASS
            valueFrom:
              secretKeyRef:
                name: postgresql-cluster-superuser
                key: password
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
  ---
  apiVersion: v1
  kind: Service
  metadata:
    name: postgres-exporter
    namespace: postgresql
    labels:
      app: postgres-exporter
  spec:
    ports:
    - port: 9187
      targetPort: 9187
      name: metrics
    selector:
      app: postgres-exporter
  ---
  # VMServiceScrape for postgres_exporter metrics
  apiVersion: operator.victoriametrics.com/v1beta1
  kind: VMServiceScrape
  metadata:
    name: postgres-exporter
    namespace: postgresql
    labels:
      release: vm
  spec:
    endpoints:
    - port: metrics
      path: /metrics
    selector:
      matchLabels:
        app: postgres-exporter
