# RustFS - S3-compatible Blob Storage
# https://artifacthub.io/packages/helm/rustfs/rustfs

enabled: true

chart:
  repository: https://charts.rustfs.com
  name: rustfs
  version: "0.0.72"

release:
  name: rustfs
  namespace: rustfs

# Ingresses created via postInstall (api + console)
ingress:
  enabled: false

# Helm values optimized for minikube
values:
  # Single node for local dev
  replicaCount: 1

  mode:
    standalone:
      enabled: true
    distributed:
      enabled: false

  # Credentials
  secret:
    rustfs:
      access_key: rustfsadmin
      secret_key: rustfsadmin

  config:
    rustfs:
      volume: "/data/rustfs"
      address: "0.0.0.0:9000"
      console_address: "0.0.0.0:9001"
      log_level: "info"
      rust_log: "info"
      console_enable: "true"
      obs_log_directory: "/logs"

  podSecurityContext:
    fsGroup: 10001
    runAsUser: 10001
    runAsGroup: 10001

  containerSecurityContext:
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false  # Chart bug: needs writable /tmp for scanner
    runAsNonRoot: true

  service:
    type: ClusterIP
    ep_port: 9000
    console_port: 9001

  # Disable chart's built-in ingress (we create our own)
  ingress:
    enabled: false

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  # Minikube storage
  storageclass:
    name: standard
    size: 1Gi

# Create ingresses for api and console
postInstall: |
  ---
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: rustfs-api-ingress
    namespace: rustfs
    annotations:
      cert-manager.io/cluster-issuer: mkcert-issuer
      nginx.ingress.kubernetes.io/affinity: cookie
      nginx.ingress.kubernetes.io/session-cookie-name: rustfs
      nginx.ingress.kubernetes.io/session-cookie-expires: "3600"
      nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
  spec:
    ingressClassName: nginx
    tls:
    - hosts:
      - api.rustfs.minikube.local
      secretName: rustfs-api-tls
    rules:
    - host: api.rustfs.minikube.local
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: rustfs-svc
              port:
                number: 9000
  ---
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: rustfs-console-ingress
    namespace: rustfs
    annotations:
      cert-manager.io/cluster-issuer: mkcert-issuer
      nginx.ingress.kubernetes.io/affinity: cookie
      nginx.ingress.kubernetes.io/session-cookie-name: rustfs-console
      nginx.ingress.kubernetes.io/session-cookie-expires: "3600"
      nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
  spec:
    ingressClassName: nginx
    tls:
    - hosts:
      - console.rustfs.minikube.local
      secretName: rustfs-console-tls
    rules:
    - host: console.rustfs.minikube.local
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: rustfs-svc
              port:
                number: 9001
